# Your username and key are issued by the socket2me server admin (bin/new-user in
# https://github.com/postpostmodern/socket2me-server). Usernames are opaque
# handles, not names: each one becomes a public https://<username>.socket2me.dev
# hostname with its own certificate, so you cannot pick your own. The values
# below are placeholders.
username: k7x2pq9wz3ma
key: supersecretkey
server: socket2me.dev

# Configure these options to match your locally hosted app.
# Requests to the socket2me server will be forwarded accordingly.
local:
  protocol: https
  host: api.lvh.me
  port: 3000
  # As a security measure, it's a good idea to restrict the paths that are accessible.
  # Add as many regex patterns to this array as you like.
  # Reserved: /up is the server's own health check and is never forwarded — a
  # pattern that matches it will not reach your local app.
  allowed_paths:
    - ^/webhooks/.*
  # If your local app is accessible via https using a self-signed certificate, you
  #   might need to set ssl verification to false.
  # You can also pass any other options that Faraday's ssl option accepts
  # See: https://lostisland.github.io/faraday/#/customization/ssl-options
  ssl:
    verify: false
